apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: user-service
           # This image tag will be replaced or pinned in the CI pipeline
          image: ghcr.io/<your-github-username>/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001 # Matches the port used in Podman
          envFrom:
            - secretRef:
                name: user-service-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
