name: Deploy to K3s (User Service)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # TODO: Replace with your actual username/org
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-k3s:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copy k8s manifests to the remote server
      - name: Copy manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.K8S_DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.K8S_DEV_SERVER_SSH_PORT }}
          source: "k8s/*"
          target: "~/app-deployments/user-service"

      - name: Deploy to K3s Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.K8S_DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.K8S_DEV_SERVER_SSH_PORT }}
          script: |
            cd ~/app-deployments/user-service/k8s
            
            # 1. Update Image Name in deployment.yaml (Ensure it matches GHCR)
            sed -i "s|ghcr.io/<your-github-username>/user-service:latest|ghcr.io/${{ env.IMAGE_NAME }}:latest|g" deployment.yaml

            # 2. Create Secrets
            kubectl delete secret user-service-secrets --ignore-not-found
            kubectl create secret generic user-service-secrets \
              --from-literal=DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              --from-literal=GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
              --from-literal=GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
              --from-literal=GOOGLE_CALLBACK_URL='${{ secrets.GOOGLE_CALLBACK_URL }}' \
              --from-literal=AZURE_AD_CLIENT_ID='${{ secrets.AZURE_AD_CLIENT_ID }}' \
              --from-literal=AZURE_AD_CLIENT_SECRET='${{ secrets.AZURE_AD_CLIENT_SECRET }}' \
              --from-literal=AZURE_AD_TENANT_ID='${{ secrets.AZURE_AD_TENANT_ID }}' \
              --from-literal=AZURE_AD_CALLBACK_URL='${{ secrets.AZURE_AD_CALLBACK_URL }}' \
              --from-literal=EMAIL_USER='${{ secrets.EMAIL_USER }}' \
              --from-literal=EMAIL_PASS='${{ secrets.EMAIL_PASS }}' \
              --from-literal=EMAIL_FROM='${{ secrets.EMAIL_FROM }}' \
              --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              --from-literal=JWT_REFRESH_SECRET='${{ secrets.JWT_REFRESH_SECRET }}' \
              --from-literal=NODE_ENV='${{ secrets.NODE_ENV }}' \
              --from-literal=PORT='${{ secrets.PORT }}' \
              --from-literal=SUPABASE_URL='${{ secrets.SUPABASE_URL }}' \
              --from-literal=SUPABASE_ANON_KEY='${{ secrets.SUPABASE_ANON_KEY }}' \
              --from-literal=SUPABASE_SERVICE_ROLE_KEY='${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
              --from-literal=OTP_EXPIRY_MINUTES='${{ secrets.OTP_EXPIRY_MINUTES }}' \
              --from-literal=OTP_COOLDOWN_SECONDS='${{ secrets.OTP_COOLDOWN_SECONDS }}' \
              --from-literal=JWT_EXPIRATION='${{ secrets.JWT_EXPIRATION }}'

            # 3. Apply Manifests
            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml

            # 4. Force Restart
            kubectl rollout restart deployment/user-service
